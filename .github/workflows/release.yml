name: Build Linux packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Build .deb and .flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake lld ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxfixes-dev \
            libayatana-appindicator3-dev \
            flatpak flatpak-builder

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive --assumeyes flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Check Flutter sources
        run: |
          flutter clean
          flutter pub get
          flutter analyze lib/main.dart lib/src/l10n.dart test/widget_test.dart
          flutter test

      - name: Build both packages from one Flutter bundle
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(scripts/build-version.sh)"
          VARPAPER_VERSION="$version" scripts/build-packages.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: |
          dpkg-deb --contents dist/*.deb > /tmp/varpaper-deb-contents.txt
          grep -q 'usr/lib/varpaper/wayvid-gui' /tmp/varpaper-deb-contents.txt
          grep -q 'usr/share/doc/varpaper/LICENSE-APACHE' /tmp/varpaper-deb-contents.txt
          test -s dist/*.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: varpaper-linux-packages
          path: |
            dist/*.deb
            dist/*.flatpak
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_args=(--title "varPaper $VERSION" --generate-notes)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.flatpak --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.flatpak "${release_args[@]}"
          fi
