name: Code Quality

on:
  push:
    branches: [ main, dev ]
    # Release workflow runs on main; tag pushes do not need a second CI run.
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**.md'
      - 'LICENSE*'
      - 'CHANGELOG.md'
      - 'configs/**'
      - 'examples/**'
      - '.gitignore'
      - '.editorconfig'
      - 'cliff.toml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**.md'
      - 'LICENSE*'
      - 'CHANGELOG.md'
      - 'configs/**'
      - 'examples/**'
      - '.gitignore'
      - '.editorconfig'
      - 'cliff.toml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  # 代码质量检查：格式、Clippy、测试
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libmpv-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libfontconfig1-dev
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      
      - name: Run tests (workspace)
        run: cargo test --workspace

      - name: Validate package scripts and Flatpak manifest
        run: |
          bash -n scripts/build-version.sh scripts/build-linux.sh scripts/build-packages.sh packaging/deb/build.sh packaging/flatpak/build.sh
          python3 -m json.tool packaging/flatpak/manifest.json > /dev/null
