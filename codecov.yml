coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

flags:
  rust:
    carryforward: true
  flutter:
    carryforward: true

# Generated code: flutter_rust_bridge bindings, Isar schemas, gen-l10n output.
ignore:
  - "rust/src/frb_generated.rs"
  - "lib/src/bridge_generated.dart/**"
  - "lib/**/*.g.dart"
  - "lib/**/*.freezed.dart"
  - "lib/l10n/app_localizations*.dart"
